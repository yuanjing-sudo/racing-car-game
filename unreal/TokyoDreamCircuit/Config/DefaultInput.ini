; Input mappings for the car. ATDCPlayerCar binds exactly these names:
;   Throttle   -1..1   (negative = reverse, limited by MaxReverseThrottle)
;   Steer      -1..1
;   Brake       0..1
;   Handbrake  action
;
; The original keyboard bindings are unchanged. Gamepad and arrow-key mappings
; have been added around them.

[/Script/Engine.InputSettings]
; ---- Keyboard: original starter bindings --------------------------------
+AxisMappings=(AxisName="Throttle",Scale=1.0,Key=W)
+AxisMappings=(AxisName="Throttle",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="Steer",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="Steer",Scale=1.0,Key=D)
+AxisMappings=(AxisName="Brake",Scale=1.0,Key=SpaceBar)
+ActionMappings=(ActionName="Handbrake",Key=LeftShift)

; ---- Arrows: alias for the same axes ------------------------------------
+AxisMappings=(AxisName="Throttle",Scale=1.0,Key=Up)
+AxisMappings=(AxisName="Throttle",Scale=-1.0,Key=Down)
+AxisMappings=(AxisName="Steer",Scale=-1.0,Key=Left)
+AxisMappings=(AxisName="Steer",Scale=1.0,Key=Right)

; ---- Gamepad ------------------------------------------------------------
+AxisMappings=(AxisName="Throttle",Scale=1.0,Key=Gamepad_RightTriggerAxis)
+AxisMappings=(AxisName="Brake",Scale=1.0,Key=Gamepad_LeftTriggerAxis)
+AxisMappings=(AxisName="Steer",Scale=1.0,Key=Gamepad_LeftX)
+ActionMappings=(ActionName="Handbrake",Key=Gamepad_FaceButton_Bottom)

; ---- Debug helper actions (bind these in C++ if you want them) ----------
+ActionMappings=(ActionName="ResetCar",Key=R)

; ---- Photo Mode (ATDCPhotoPawn) ----------------------------------------
; The car's own W/S/A/D bindings are untouched: while a shot is framed the car
; is unpossessed, so the same keys drive the free camera.
+AxisMappings=(AxisName="PhotoForward",Scale=1.0,Key=W)
+AxisMappings=(AxisName="PhotoForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="PhotoRight",Scale=1.0,Key=D)
+AxisMappings=(AxisName="PhotoRight",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="PhotoUp",Scale=1.0,Key=E)
+AxisMappings=(AxisName="PhotoUp",Scale=-1.0,Key=Q)
+AxisMappings=(AxisName="PhotoTurn",Scale=2.0,Key=MouseX)
+AxisMappings=(AxisName="PhotoLookUp",Scale=-2.0,Key=MouseY)
+AxisMappings=(AxisName="PhotoFOV",Scale=1.0,Key=MouseWheelAxis)
+ActionMappings=(ActionName="PhotoMode",Key=P)
+ActionMappings=(ActionName="PhotoCapture",Key=F12)
+ActionMappings=(ActionName="PhotoBoost",Key=LeftShift)
+ActionMappings=(ActionName="PhotoApertureUp",Key=RightBracket)
+ActionMappings=(ActionName="PhotoApertureDown",Key=LeftBracket)
+ActionMappings=(ActionName="PhotoFocusNear",Key=PageDown)
+ActionMappings=(ActionName="PhotoFocusFar",Key=PageUp)

; Photo Mode needs the mouse for look and the wheel for the lens.
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
